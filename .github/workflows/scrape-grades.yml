name: Scrape Grades

on:
  # Trigger at both UTC candidates for 7:00am, 3:00pm, and 8:00pm Eastern.
  # The guard below keeps only the candidate matching the current EST/EDT offset.
  schedule:
    - cron: '0 0 * * *'
    - cron: '0 1 * * *'
    - cron: '0 11 * * *'
    - cron: '0 12 * * *'
    - cron: '0 19 * * *'
    - cron: '0 20 * * *'

  # Allow manual triggering from GitHub Actions tab
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Check Eastern schedule
        id: local_schedule
        run: |
          scheduled_hour=$(echo "${{ github.event.schedule }}" | awk '{print $2}')
          eastern_offset=$(TZ=America/New_York date +%z)
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            should_run=true
          elif [[ "$eastern_offset" == "-0400" && ( "$scheduled_hour" == "0" || "$scheduled_hour" == "11" || "$scheduled_hour" == "19" ) ]]; then
            should_run=true
          elif [[ "$eastern_offset" == "-0500" && ( "$scheduled_hour" == "1" || "$scheduled_hour" == "12" || "$scheduled_hour" == "20" ) ]]; then
            should_run=true
          else
            should_run=false
          fi
          if [[ "$should_run" == "true" ]]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          fi

      # Check out the repository
      - name: Checkout repository
        if: steps.local_schedule.outputs.should_run == 'true'
        uses: actions/checkout@v4

      # Set up Node.js
      - name: Setup Node.js
        if: steps.local_schedule.outputs.should_run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # Install dependencies
      - name: Install dependencies
        if: steps.local_schedule.outputs.should_run == 'true'
        run: npm ci

      # Install Playwright browsers
      - name: Install Playwright browsers
        if: steps.local_schedule.outputs.should_run == 'true'
        run: npx playwright install --with-deps chromium

      # Run the enhanced scraper (grades + detailed assignments)
      - name: Run scraper
        if: steps.local_schedule.outputs.should_run == 'true'
        env:
          SKYWARD_USERNAME: ${{ secrets.SKYWARD_USERNAME }}
          SKYWARD_PASSWORD: ${{ secrets.SKYWARD_PASSWORD }}
        run: node scraper/enhanced-scraper.cjs

      # Commit and push changes if there are any
      - name: Commit and push changes
        if: steps.local_schedule.outputs.should_run == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add -A
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update grades data [automated]" && git push)
